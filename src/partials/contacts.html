<section class="contacts" id="contacts">
  <div class="container">
    <div class="contacts-header">
      <p class="contacts-label">Connect</p>
      <div class="contacts-header-main">
        <h2 class="contacts-title">Order your unique jewelry</h2>
        <p class="contacts-desc">We'd love to hear more details from you!</p>
      </div>
    </div>

    <div class="contacts-wrapper">
      <form class="contacts-form" action="#" method="POST">
        <div class="contacts-field">
          <label class="contacts-field-label" for="contact-name"
            >Name<span class="contacts-required">*</span></label
          >
          <input
            class="contacts-input"
            type="text"
            id="contact-name"
            name="name"
            placeholder="Tony"
            required
            pattern="^[a-zA-Z\s\.]{5,28}$"
            minlength="5"
            maxlength="28"
            title="Only letters, spaces and dots. Min 5, max 28 characters."
          />
          <span class="contacts-error">Error Text</span>
        </div>

        <div class="contacts-field">
          <label class="contacts-field-label" for="contact-phone"
            >Phone<span class="contacts-required">*</span></label
          >
          <input
            class="contacts-input"
            type="tel"
            id="contact-phone"
            name="phone"
            placeholder="+1 234 123 23"
            required
            pattern="^\+[0-9\s]{14}$"
            title="Format: + and 14 digits/spaces. Example: +1 555 000 0000"
          />
          <span class="contacts-error">Error Text</span>
        </div>

        <div class="contacts-field">
          <label class="contacts-field-label" for="contact-message"
            >Describe what you want</label
          >
          <textarea
            class="contacts-textarea"
            id="contact-message"
            name="message"
            placeholder="Type your message..."
            minlength="10"
            maxlength="500"
            title="Min 10, max 500 characters."
          ></textarea>
          <span class="contacts-error">Error Text</span>
        </div>

        <button class="contacts-submit" type="submit">Submit</button>
      </form>

      <ul class="contacts-list">
        <li class="contacts-item">
          <div class="contacts-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </div>
          <div class="contacts-info">
            <p class="contacts-type">Email</p>
            <a class="contacts-link" href="mailto:info@handmadejewelry.com"
              >info@handmadejewelry.com</a
            >
          </div>
        </li>

        <li class="contacts-item">
          <div class="contacts-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
          </div>
          <div class="contacts-info">
            <p class="contacts-type">Phone</p>
            <a class="contacts-link" href="tel:+15550000000"
              >+1 (555) 000-0000</a
            >
          </div>
        </li>

        <li class="contacts-item">
          <div class="contacts-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
          </div>
          <div class="contacts-info">
            <p class="contacts-type">Office</p>
            <a
              class="contacts-link"
              href="https://www.google.com/maps/search/?api=1&query=76-8+Oakington+Manor+Dr,+London,+UK"
              target="_blank"
              rel="noopener noreferrer"
              >76-8 Oakington Manor Dr, London, UK</a
            >
          </div>
        </li>
      </ul>
    </div>
  </div>
</section>
