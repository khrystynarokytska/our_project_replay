<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANDMADE JEWELRY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <!-- Loads the specified .html file -->
      <load src="./partials/hero.html" />
      <load src="./partials/about-us.html" />
      <load src="./partials/benefits.html" />
      <load src="./partials/gallery.html" />
      <load src="./partials/testimonials.html" />
      <load src="./partials/contacts.html" />
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/mobile-menu.html" />
    <load src="./partials/modal.html" />

    <script type="module">
      const mobileMenu = document.getElementById('mobile-menu');
      const openButton = document.querySelector('[data-menu-open]');
      const closeButton = document.querySelector('[data-menu-close]');
      const menuLinks = document.querySelectorAll('[data-menu-link]');

      if (mobileMenu && openButton && closeButton) {
        const openMenu = () => {
          mobileMenu.classList.add('is-open');
          mobileMenu.setAttribute('aria-hidden', 'false');
          openButton.setAttribute('aria-expanded', 'true');
          document.body.classList.add('no-scroll');
        };

        const closeMenu = () => {
          mobileMenu.classList.remove('is-open');
          mobileMenu.setAttribute('aria-hidden', 'true');
          openButton.setAttribute('aria-expanded', 'false');
          document.body.classList.remove('no-scroll');
        };

        openButton.addEventListener('click', openMenu);
        closeButton.addEventListener('click', closeMenu);

        menuLinks.forEach(link => {
          link.addEventListener('click', closeMenu);
        });

        mobileMenu.addEventListener('click', event => {
          if (event.target === mobileMenu) {
            closeMenu();
          }
        });

        window.addEventListener('keydown', event => {
          if (event.key === 'Escape') {
            closeMenu();
          }
        });
      }
    </script>
  </body>
</html>
